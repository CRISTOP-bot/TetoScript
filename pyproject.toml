[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetoscript-prototype"
version = "0.3.0"
description = "Intérprete experimental del lenguaje TetoScript"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
teto = "tetoscript.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
