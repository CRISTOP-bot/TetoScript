name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Statically check example
        run: python -m tetoscript check examples/hello.teto
      - name: Check example output
        run: |
          output="$(PYTHONPATH=src python -m tetoscript examples/hello.teto)"
          test "$output" = "Hola, Teto!"
